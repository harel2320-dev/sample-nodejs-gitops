apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-nodejs
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:harel2320-dev/sample-nodejs-gitops.git
    targetRevision: main
    path: apps/sample-nodejs

  destination:
    server: https://kubernetes.default.svc
    namespace: sample-nodejs

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
